banks:
  HDFC:
    identify_by:
      sender_contains: "alerts@hdfcbank.bank.in"
      subject_contains: "UPI txn"
    fields:
      amount:
        pattern: 'Rs\.(\d+(?:\.\d{2})?)'
      account:
        pattern: 'account ending\s+(\d+)'
      vpa:
        pattern: 'towards VPA\s+(\S+)'
      merchant:
        pattern: 'towards VPA\s+\S+\s+(.+?)\s+on\s+\d{2}-\d{2}-\d{2}'
      date:
        pattern: 'on\s+(\d{2}-\d{2}-\d{2})\.'
        format: "%d-%m-%y"
      upi_ref:
        pattern: 'reference no\.:\s+(\d+)'
      txn_type:
        debit_if_contains: "debited"
        credit_if_contains: "credited"
    sample: "Dear Customer, Rs.50.00 is debited from your account ending 8891 towards VPA paytm.s22g4ya@pty (HOTEL BHOJANAM) on 09-05-26. UPI transaction reference no.: 122874895149."
